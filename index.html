<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WrangStream</title>
    <style>
        :root {
            --bg: #000000;
            --surface: #0d0d0d;
            --surface-elevated: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-tertiary: rgba(255, 255, 255, 0.45);
            --accent: #f5f5f7;
            --accent-blue: #2997ff;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-bg-hover: rgba(255, 255, 255, 0.07);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 24px;
            --font-stack: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif;
            --transition-smooth: 0.35s cubic-bezier(0.25, 0.1, 0.25, 1);
            --transition-slow: 0.55s cubic-bezier(0.25, 0.1, 0.25, 1);
            --transition-fast: 0.18s cubic-bezier(0.25, 0.1, 0.25, 1);
            --player-controls-height: 56px;
            --nav-height: 56px;
            --max-content-width: 1400px;
            --shadow-soft: 0 2px 20px rgba(0, 0, 0, 0.5);
            --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.4), 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            scroll-behavior: smooth;
            background: var(--bg);
            color: var(--text-primary);
            font-family: var(--font-stack);
            letter-spacing: -0.01em;
            height: 100%;
            overflow: hidden;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--bg);
            overflow-x: hidden;
            overflow-y: auto;
            height: 100%;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
        }

        body::-webkit-scrollbar {
            width: 4px;
        }
        body::-webkit-scrollbar-track {
            background: transparent;
        }
        body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        #app {
            min-height: 100vh;
            min-height: 100dvh;
            position: relative;
            z-index: 1;
            isolation: isolate;
        }

        #immersion-backdrop {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity var(--transition-slow);
            background-size: cover;
            background-position: center;
            filter: blur(90px) saturate(1.4);
            transform: scale(1.15);
        }
        #immersion-backdrop.active {
            opacity: 1;
        }
        #immersion-overlay {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.25) 0%, rgba(0, 0, 0, 0.7) 60%, rgba(0, 0, 0, 0.92) 100%);
            opacity: 0;
            transition: opacity var(--transition-slow);
        }
        #immersion-overlay.active {
            opacity: 1;
        }
        #immersion-backdrop-2 {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            opacity: 0;
            transition: opacity var(--transition-slow);
            background-size: cover;
            background-position: center;
            filter: blur(90px) saturate(1.4);
            transform: scale(1.15);
        }

        #orientation-overlay {
            animation: fadeInOverlay 0.3s ease-out;
        }
        @keyframes fadeInOverlay {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        #nav {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            height: var(--nav-height);
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            gap: 16px;
            transition: background var(--transition-smooth);
        }
        #nav.scrolled {
            background: rgba(0, 0, 0, 0.78);
            border-bottom-color: rgba(255, 255, 255, 0.1);
        }
        #nav .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            cursor: pointer;
            white-space: nowrap;
            transition: opacity var(--transition-fast);
        }
        #nav .logo:hover {
            opacity: 0.8;
        }
        #nav .logo svg {
            width: 26px;
            height: 26px;
            flex-shrink: 0;
        }
        #nav .search-wrap {
            position: relative;
            flex: 1;
            max-width: 340px;
            min-width: 160px;
        }
        #nav .search-wrap input {
            width: 100%;
            height: 36px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            padding: 0 16px 0 38px;
            font-size: 0.9rem;
            font-family: var(--font-stack);
            letter-spacing: -0.01em;
            outline: none;
            transition: all var(--transition-fast);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        #nav .search-wrap input::placeholder {
            color: var(--text-tertiary);
        }
        #nav .search-wrap input:focus {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.03);
        }
        #nav .search-wrap .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            opacity: 0.45;
            width: 16px;
            height: 16px;
        }
        #nav .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #nav .nav-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
        }
        #nav .nav-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.06);
        }
        #nav .nav-btn svg {
            width: 18px;
            height: 18px;
        }

        .view {
            display: none;
            animation: fadeInView 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        .view.active {
            display: block;
        }
        @keyframes fadeInView {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #home-view {
            padding: 32px 28px 60px;
            max-width: var(--max-content-width);
            margin: 0 auto;
        }
        #home-view .section-header {
            margin-bottom: 24px;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        #home-view .section-title {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.025em;
            color: var(--text-primary);
        }
        #home-view .section-subtitle {
            font-size: 0.85rem;
            color: var(--text-tertiary);
            letter-spacing: 0;
        }
        #video-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }
        #no-results {
            display: none;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-tertiary);
            font-size: 0.95rem;
            grid-column: 1 / -1;
        }
        #no-results.visible {
            display: block;
        }

        .video-card {
            cursor: pointer;
            border-radius: var(--radius-lg);
            overflow: hidden;
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all var(--transition-smooth);
            position: relative;
            will-change: transform;
        }
        .video-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: var(--shadow-card);
            background: var(--surface-elevated);
        }
        .video-card:active {
            transform: scale(0.985);
            transition: transform 0.1s ease-out;
        }
        .video-card .thumb-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            overflow: hidden;
            background: #111;
        }
        .video-card .thumb-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform var(--transition-slow);
            loading: lazy;
        }
        .video-card:hover .thumb-wrap img {
            transform: scale(1.04);
        }
        .video-card .thumb-wrap .play-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0);
            transition: background var(--transition-smooth);
            pointer-events: none;
        }
        .video-card:hover .thumb-wrap .play-overlay {
            background: rgba(0, 0, 0, 0.25);
        }
        .video-card .thumb-wrap .play-overlay svg {
            width: 44px;
            height: 44px;
            opacity: 0;
            transform: scale(0.8);
            transition: all var(--transition-smooth);
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
        }
        .video-card:hover .thumb-wrap .play-overlay svg {
            opacity: 1;
            transform: scale(1);
        }
        .video-card .card-info {
            padding: 14px 16px 16px;
        }
        .video-card .card-title {
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: -0.015em;
            color: var(--text-primary);
            margin-bottom: 6px;
            line-height: 1.25;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .video-card .card-meta {
            font-size: 0.8rem;
            color: var(--text-tertiary);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .video-card .card-meta .dot {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--text-tertiary);
            flex-shrink: 0;
        }

        #watch-view {
            display: none;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            position: relative;
            z-index: 2;
            padding-bottom: 40px;
        }
        #watch-view.active {
            display: flex;
        }
        #watch-view .watch-nav {
            position: sticky;
            top: 0;
            z-index: 90;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 0 24px;
            height: var(--nav-height);
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        #watch-view .back-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-family: var(--font-stack);
            letter-spacing: -0.01em;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        #watch-view .back-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
        }
        #watch-view .back-btn svg {
            width: 16px;
            height: 16px;
        }
        #watch-view .watch-content {
            display: flex;
            gap: 28px;
            padding: 24px 28px 40px;
            max-width: var(--max-content-width);
            margin: 0 auto;
            width: 100%;
            flex: 1;
            align-items: flex-start;
        }
        #watch-view .player-col {
            flex: 1;
            min-width: 0;
            max-width: 900px;
        }
        #watch-view .sidebar-col {
            width: 320px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        #watch-view .sidebar-heading {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0;
            padding: 0 4px;
            margin-bottom: 2px;
        }
        #watch-view .sidebar-video {
            display: flex;
            gap: 12px;
            cursor: pointer;
            padding: 8px;
            border-radius: var(--radius-md);
            transition: all var(--transition-fast);
            border: 1px solid transparent;
            background: transparent;
        }
        #watch-view .sidebar-video:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.06);
        }
        #watch-view .sidebar-video .s-thumb {
            width: 120px;
            height: 68px;
            border-radius: var(--radius-sm);
            object-fit: cover;
            flex-shrink: 0;
            background: #111;
        }
        #watch-view .sidebar-video .s-info {
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
        }
        #watch-view .sidebar-video .s-title {
            font-size: 0.82rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            color: var(--text-primary);
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        #watch-view .sidebar-video .s-meta {
            font-size: 0.72rem;
            color: var(--text-tertiary);
        }

        #player-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-soft);
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        #player-container video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background: #000;
        }
        #player-container .buffering-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #player-container .buffering-indicator.visible {
            opacity: 1;
        }
        #player-container .buffering-indicator .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        #player-container .center-play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.25s;
            width: 64px;
            height: 64px;
            background: rgba(0, 0, 0, 0.55);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        #player-container .center-play-btn svg {
            width: 28px;
            height: 28px;
            margin-left: 3px;
        }
        #player-container.paused .center-play-btn {
            opacity: 1;
        }
        #player-container.idle .center-play-btn {
            opacity: 0;
            transition: opacity 0.5s;
        }

        #player-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.75) 40%, rgba(0, 0, 0, 0.9));
            padding: 36px 16px 14px;
            opacity: 0;
            transition: opacity 0.35s ease-out;
            pointer-events: none;
            border-radius: 0 0 var(--radius-lg) var(--radius-lg);
        }
        #player-container:hover #player-controls,
        #player-container.show-controls #player-controls,
        #player-container.paused #player-controls {
            opacity: 1;
            pointer-events: auto;
        }
        #player-controls .seek-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        #player-controls .time-display {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.8);
            font-variant-numeric: tabular-nums;
            font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
            letter-spacing: 0;
            min-width: 36px;
            text-align: center;
            flex-shrink: 0;
        }
        #player-controls input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
            flex: 1;
            height: 20px;
            margin: 0;
            position: relative;
        }
        #player-controls input[type="range"]::-webkit-slider-runnable-track {
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.2);
            transition: height 0.15s;
        }
        #player-controls input[type="range"]:hover::-webkit-slider-runnable-track {
            height: 6px;
            border-radius: 3px;
        }
        #player-controls input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            margin-top: -5px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
            transition: transform 0.1s;
            opacity: 0;
        }
        #player-controls input[type="range"]:hover::-webkit-slider-thumb,
        #player-container:hover #player-controls input[type="range"]::-webkit-slider-thumb {
            opacity: 1;
        }
        #player-controls input[type="range"]:active::-webkit-slider-thumb {
            transform: scale(1.2);
        }
        #player-controls .ctrl-row {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }
        #player-controls .ctrl-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.85);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            flex-shrink: 0;
        }
        #player-controls .ctrl-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }
        #player-controls .ctrl-btn svg {
            width: 18px;
            height: 18px;
        }
        #player-controls .ctrl-btn.volume-btn {
            position: relative;
        }
        #player-controls .volume-slider-wrap {
            display: flex;
            align-items: center;
            width: 0;
            overflow: hidden;
            transition: width 0.25s ease-out;
        }
        #player-controls .volume-group:hover .volume-slider-wrap,
        #player-controls .volume-slider-wrap.show {
            width: 70px;
        }
        #player-controls .volume-group {
            display: flex;
            align-items: center;
            gap: 0;
        }
        #player-controls .volume-slider-wrap input[type="range"] {
            width: 60px;
            flex: none;
        }
        #player-controls .volume-slider-wrap input[type="range"]::-webkit-slider-thumb {
            opacity: 1;
            width: 12px;
            height: 12px;
            margin-top: -4px;
        }
        #player-controls .spacer {
            flex: 1;
        }
        #player-controls .speed-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 14px;
            font-size: 0.75rem;
            font-family: var(--font-stack);
            font-weight: 500;
            letter-spacing: 0;
            transition: all var(--transition-fast);
            white-space: nowrap;
        }
        #player-controls .speed-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        #video-meta {
            padding: 18px 4px;
        }
        #video-meta .meta-title {
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
            color: var(--text-primary);
        }
        #video-meta .meta-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }
        #video-meta .meta-channel {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        #video-meta .meta-date {
            font-size: 0.8rem;
            color: var(--text-tertiary);
        }
        #video-meta .meta-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        #video-meta .action-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 9px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.82rem;
            font-family: var(--font-stack);
            letter-spacing: -0.01em;
            transition: all var(--transition-fast);
            white-space: nowrap;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        #video-meta .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.25);
        }
        #video-meta .action-btn.active {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }
        #video-meta .action-btn svg {
            width: 16px;
            height: 16px;
        }
        #video-meta .subscribe-btn {
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            border: none;
            font-weight: 500;
        }

                updateSubscribeUI();
                renderComments(video);
                renderSidebar(videoId);
                playerContainer.classList.add('paused');
                playerContainer.classList.remove('idle');
                videoElement.src = video.streamUrl;
                videoElement.load();
                videoElement.currentTime = 0;
                isPlaying = false;
                updatePlayIcon();
                seekBar.value = 0;
                timeCurrent.textContent = '0:00';
                timeDuration.textContent = '0:00';
                currentSpeed = 1;
                speedIndex = 2;
                btnSpeed.textContent = '1×';
                videoElement.playbackRate = 1;
                window.scrollTo({ top: 0, behavior: 'smooth' });
                resetControlsTimer();
                playerContainer.classList.add('show-controls');
                clearTimeout(hideControlsTimer);
                hideControlsTimer = setTimeout(() => {
                    if (isPlaying) {
                        playerContainer.classList.remove('show-controls');
                        playerContainer.classList.add('idle');
                    }
                }, 3000);
            }

            function updatePlayIcon() {
                if (isPlaying) {
                    iconPlay.style.display = 'none';
                    iconPause.style.display = 'block';
                } else {
                    iconPlay.style.display = 'block';
                    iconPause.style.display = 'none';
                }
            }

            function updateLikeUI() {
                if (!currentVideoId) return;
                const liked = getLikeState(currentVideoId);
                const count = getLikeCount(currentVideoId);
                likeCount.textContent = count;
                if (liked) {
                    btnLike.classList.add('active');
                } else {
                    btnLike.classList.remove('active');
                }
            }

            function updateDislikeUI() {
                if (!currentVideoId) return;
                const disliked = getDislikeState(currentVideoId);
                const count = getDislikeCount(currentVideoId);
                dislikeCount.textContent = count;
                if (disliked) {
                    btnDislike.classList.add('active');
                } else {
                    btnDislike.classList.remove('active');
                }
            }

            function updateSubscribeUI() {
                if (!currentVideoId) return;
                const subbed = getSubscribeState(currentVideoId);
                if (subbed) {
                    btnSubscribe.textContent = 'Subscribed';
                    btnSubscribe.classList.add('subscribed');
                } else {
                    btnSubscribe.textContent = 'Subscribe';
                    btnSubscribe.classList.remove('subscribed');
                }
            }

            function renderComments(video) {
                commentsList.innerHTML = '';
                video.comments.forEach(c => {
                    const div = document.createElement('div');
                    div.className = 'comment';
                    const initial = c.author.charAt(0).toUpperCase();
                    div.innerHTML = `
                <div class="comment-avatar">${initial}</div>
                <div class="comment-body">
                  <div class="comment-author">${escapeHTML(c.author)}</div>
                  <div class="comment-text">${escapeHTML(c.text)}</div>
                  <div class="comment-time">${escapeHTML(c.time)}</div>
                </div>`;
                    commentsList.appendChild(div);
                });
            }

            function renderSidebar(currentVidId) {
                const existingHeading = sidebarCol.querySelector('.sidebar-heading');
                sidebarCol.innerHTML = '';
                if (existingHeading) {
                    sidebarCol.appendChild(existingHeading);
                } else {
                    const heading = document.createElement('span');
                    heading.className = 'sidebar-heading';
                    heading.textContent = 'Recommended';
                    sidebarCol.appendChild(heading);
                }
                const others = processedVideos.filter(v => v.id !== currentVidId);
                others.forEach(v => {
                    const card = document.createElement('div');
                    card.className = 'sidebar-video';
                    card.innerHTML = `
                <img class="s-thumb" src="${escapeHTML(v.thumbnailUrl)}" alt="${escapeHTML(v.title)}" loading="lazy">
                <div class="s-info">
                  <span class="s-title">${escapeHTML(v.title)}</span>
                  <span class="s-meta">${escapeHTML(v.uploader)} · ${escapeHTML(v.publishedDate)}</span>
                </div>`;
                    card.addEventListener('click', () => {
                        showWatchView(v.id);
                    });
                    sidebarCol.appendChild(card);
                });
            }

            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function createVideoCard(video) {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.setAttribute('data-video-id', video.id);
                card.innerHTML = `
              <div class="thumb-wrap">
                <img src="${escapeHTML(video.thumbnailUrl)}" alt="${escapeHTML(video.title)}" loading="lazy">
                <div class="play-overlay">
                  <svg viewBox="0 0 24 24" fill="white"><polygon points="6,3 20,12 6,21"/></svg>
                </div>
              </div>
              <div class="card-info">
                <div class="card-title">${escapeHTML(video.title)}</div>
                <div class="card-meta">
                  <span>${escapeHTML(video.uploader)}</span>
                  <span class="dot"></span>
                  <span>${escapeHTML(video.publishedDate)}</span>
                </div>
              </div>`;
                card.addEventListener('click', () => {
                    showWatchView(video.id);
                });
                return card;
            }

            function renderVideoGrid(filterText = '') {
                videoGrid.innerHTML = '';
                const ft = filterText.toLowerCase().trim();
                let filtered = processedVideos;
                if (ft) {
                    filtered = processedVideos.filter(v =>
                        v.title.toLowerCase().includes(ft) ||
                        v.uploader.toLowerCase().includes(ft)
                    );
                }
                if (filtered.length === 0) {
                    noResults.classList.add('visible');
                    videoCountLabel.textContent = '0 videos';
                } else {
                    noResults.classList.remove('visible');
                    videoCountLabel.textContent = `${filtered.length} video${filtered.length !== 1 ? 's' : ''}`;
                }
                filtered.forEach(v => {
                    videoGrid.appendChild(createVideoCard(v));
                });
            }

            function resetControlsTimer() {
                clearTimeout(controlsTimeout);
                if (isPlaying) {
                    controlsTimeout = setTimeout(() => {
                        playerContainer.classList.remove('show-controls');
                        if (isPlaying && !videoElement.paused) {
                            playerContainer.classList.add('idle');
                        }
                    }, 2500);
                }
            }

            function showControlsTemporarily() {
                playerContainer.classList.add('show-controls');
                playerContainer.classList.remove('idle');
                resetControlsTimer();
            }

            videoElement.addEventListener('loadedmetadata', () => {
                timeDuration.textContent = formatTime(videoElement.duration);
                seekBar.max = videoElement.duration || 100;
                seekBar.value = videoElement.currentTime || 0;
            });

            videoElement.addEventListener('timeupdate', () => {
                if (!isNaN(videoElement.duration) && isFinite(videoElement.duration)) {
                    seekBar.value = videoElement.currentTime;
                    seekBar.max = videoElement.duration;
                    timeCurrent.textContent = formatTime(videoElement.currentTime);
                    timeDuration.textContent = formatTime(videoElement.duration);
                }
            });

            videoElement.addEventListener('play', () => {
                isPlaying = true;
                updatePlayIcon();
                playerContainer.classList.remove('paused');
                bufferingIndicator.classList.remove('visible');
                resetControlsTimer();
            });

            videoElement.addEventListener('pause', () => {
                isPlaying = false;
                updatePlayIcon();
                playerContainer.classList.add('paused');
                playerContainer.classList.remove('idle');
                playerContainer.classList.add('show-controls');
                clearTimeout(controlsTimeout);
            });

            videoElement.addEventListener('playing', () => {
                bufferingIndicator.classList.remove('visible');
                isPlaying = true;
                updatePlayIcon();
                playerContainer.classList.remove('paused');
                resetControlsTimer();
            });

            videoElement.addEventListener('waiting', () => {
                bufferingIndicator.classList.add('visible');
            });

            videoElement.addEventListener('canplay', () => {
                bufferingIndicator.classList.remove('visible');
            });

            videoElement.addEventListener('ended', () => {
                isPlaying = false;
                updatePlayIcon();
                playerContainer.classList.add('paused');
                playerContainer.classList.remove('idle');
                playerContainer.classList.add('show-controls');
                clearTimeout(controlsTimeout);
            });

            videoElement.addEventListener('error', () => {
                bufferingIndicator.classList.remove('visible');
                isPlaying = false;
                updatePlayIcon();
                playerContainer.classList.add('paused');
                playerContainer.classList.remove('idle');
                playerContainer.classList.add('show-controls');
            });

            seekBar.addEventListener('input', () => {
                const val = parseFloat(seekBar.value);
                if (!isNaN(val) && isFinite(val) && videoElement.duration) {
                    videoElement.currentTime = val;
                    timeCurrent.textContent = formatTime(val);
                }
            });

            seekBar.addEventListener('change', () => {
                resetControlsTimer();
            });

            volumeBar.addEventListener('input', () => {
                const val = parseFloat(volumeBar.value) / 100;
                videoElement.volume = Math.max(0, Math.min(1, val));
                if (videoElement.volume === 0) {
                    isMuted = true;
                    updateMuteIcon();
                } else {
                    isMuted = false;
                    updateMuteIcon();
                    volumeBeforeMute = parseFloat(volumeBar.value);
                }
            });

            function updateMuteIcon() {
                if (isMuted || videoElement.volume === 0) {
                    iconVolOn.style.display = 'none';
                    iconVolOff.style.display = 'block';
                } else {
                    iconVolOn.style.display = 'block';
                    iconVolOff.style.display = 'none';
                }
            }

            btnPlay.addEventListener('click', (e) => {
                e.stopPropagation();
                togglePlay();
            });

            playerContainer.addEventListener('click', (e) => {
                if (e.target === playerContainer || e.target === videoElement || e.target ===
                    centerPlayBtn || e.target.closest('#center-play-btn')) {
                    if (e.target.closest('#player-controls')) return;
                    if (e.target.closest('.ctrl-btn') || e.target.closest('input')) return;
                    togglePlay();
                }
            });

            function togglePlay() {
                if (!videoElement.src && currentVideoId) {
                    const video = processedVideos.find(v => v.id === currentVideoId);
                    if (video) {
                        videoElement.src = video.streamUrl;
                        videoElement.load();
                    }
                }
                if (videoElement.paused || videoElement.ended) {
                    videoElement.play().catch(() => {});
                    isPlaying = true;
                    updatePlayIcon();
                    playerContainer.classList.remove('paused');
                    playerContainer.classList.remove('idle');
                    playerContainer.classList.add('show-controls');
                    resetControlsTimer();
                } else {
                    videoElement.pause();
                    isPlaying = false;
                    updatePlayIcon();
                    playerContainer.classList.add('paused');
                    playerContainer.classList.remove('idle');
                    playerContainer.classList.add('show-controls');
                    clearTimeout(controlsTimeout);
                }
            }

            btnMute.addEventListener('click', (e) => {
                e.stopPropagation();
                if (isMuted || videoElement.volume === 0) {
                    videoElement.volume = volumeBeforeMute / 100 || 0.8;
                    volumeBar.value = volumeBeforeMute || 80;
                    isMuted = false;
                } else {
                    volumeBeforeMute = Math.round(videoElement.volume * 100);
                    videoElement.volume = 0;
                    volumeBar.value = 0;
                    isMuted = true;
                }
                updateMuteIcon();
            });

            btnMute.addEventListener('mouseenter', () => {
                volumeSliderWrap.classList.add('show');
            });
            const volumeGroup = btnMute.closest('.volume-group');
            if (volumeGroup) {
                volumeGroup.addEventListener('mouseenter', () => {
                    volumeSliderWrap.classList.add('show');
                });
                volumeGroup.addEventListener('mouseleave', () => {
                    setTimeout(() => {
                        if (!volumeGroup.matches(':hover')) {
                            volumeSliderWrap.classList.remove('show');
                        }
                    }, 200);
                });
            }

            btnSpeed.addEventListener('click', (e) => {
                e.stopPropagation();
                speedIndex = (speedIndex + 1) % speedOptions.length;
                currentSpeed = speedOptions[speedIndex];
                videoElement.playbackRate = currentSpeed;
                btnSpeed.textContent = currentSpeed + '×';
            });

            btnPip.addEventListener('click', async (e) => {
                e.stopPropagation();
                try {
                    if (document.pictureInPictureElement) {
                        await document.exitPictureInPicture();
                    } else if (document.pictureInPictureEnabled && videoElement.readyState >= 1) {
                        await videoElement.requestPictureInPicture();
                    }
                } catch (err) {}
            });

            btnFullscreen.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleFullscreen();
            });

            function toggleFullscreen() {
                if (document.fullscreenElement || document.webkitFullscreenElement) {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    }
                } else {
                    const el = playerContainer;
                    if (el.requestFullscreen) {
                        el.requestFullscreen();
                    } else if (el.webkitRequestFullscreen) {
                        el.webkitRequestFullscreen();
                    }
                }
            }

            document.addEventListener('fullscreenchange', updateFullscreenIcon);
            document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);

            function updateFullscreenIcon() {
                if (document.fullscreenElement || document.webkitFullscreenElement) {
                    iconFsEnter.style.display = 'none';
                    iconFsExit.style.display = 'block';
                } else {
                    iconFsEnter.style.display = 'block';
                    iconFsExit.style.display = 'none';
                }
            }

            btnLike.addEventListener('click', () => {
                if (!currentVideoId) return;
                const currentlyLiked = getLikeState(currentVideoId);
                const currentlyDisliked = getDislikeState(currentVideoId);
                if (currentlyLiked) {
                    setLikeState(currentVideoId, false);
                    setLikeCount(currentVideoId, getLikeCount(currentVideoId) - 1);
                } else {
                    setLikeState(currentVideoId, true);
                    setLikeCount(currentVideoId, getLikeCount(currentVideoId) + 1);
                    if (currentlyDisliked) {
                        setDislikeState(currentVideoId, false);
                        setDislikeCount(currentVideoId, getDislikeCount(currentVideoId) - 1);
                    }
                }
                updateLikeUI();
                updateDislikeUI();
            });

            btnDislike.addEventListener('click', () => {
                if (!currentVideoId) return;
                const currentlyDisliked = getDislikeState(currentVideoId);
                const currentlyLiked = getLikeState(currentVideoId);
                if (currentlyDisliked) {
                    setDislikeState(currentVideoId, false);
                    setDislikeCount(currentVideoId, getDislikeCount(currentVideoId) - 1);
                } else {
                    setDislikeState(currentVideoId, true);
                    setDislikeCount(currentVideoId, getDislikeCount(currentVideoId) + 1);
                    if (currentlyLiked) {
                        setLikeState(currentVideoId, false);
                        setLikeCount(currentVideoId, getLikeCount(currentVideoId) - 1);
                    }
                }
                updateDislikeUI();
                updateLikeUI();
            });

            btnSubscribe.addEventListener('click', () => {
                if (!currentVideoId) return;
                const currentlySubbed = getSubscribeState(currentVideoId);
                setSubscribeState(currentVideoId, !currentlySubbed);
                updateSubscribeUI();
            });

            btnBack.addEventListener('click', showHomeView);
            btnHomeNav.addEventListener('click', showHomeView);
            navLogo.addEventListener('click', showHomeView);

            searchInput.addEventListener('input', () => {
                if (homeView.classList.contains('active')) {
                    renderVideoGrid(searchInput.value);
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' && e.target.type === 'text') return;
                const key = e.key.toLowerCase();
                switch (key) {
                    case ' ':
                        e.preventDefault();
                        if (watchView.classList.contains('active')) {
                            togglePlay();
                            showControlsTemporarily();
                        }
                        break;
                    case 'arrowleft':
                        e.preventDefault();
                        if (watchView.classList.contains('active') && videoElement.duration) {
                            videoElement.currentTime = Math.max(0, videoElement.currentTime - 10);
                            showControlsTemporarily();
                        }
                        break;
                    case 'arrowright':
                        e.preventDefault();
                        if (watchView.classList.contains('active') && videoElement.duration) {
                            videoElement.currentTime = Math.min(videoElement.duration, videoElement
                                .currentTime + 10);
                            showControlsTemporarily();
                        }
                        break;
                    case 'arrowup':
                        e.preventDefault();
                        if (watchView.classList.contains('active')) {
                            videoElement.volume = Math.min(1, videoElement.volume + 0.1);
                            volumeBar.value = Math.round(videoElement.volume * 100);
                            isMuted = videoElement.volume === 0;
                            updateMuteIcon();
                            showControlsTemporarily();
                        }
                        break;
                    case 'arrowdown':
                        e.preventDefault();
                        if (watchView.classList.contains('active')) {
                            videoElement.volume = Math.max(0, videoElement.volume - 0.1);
                            volumeBar.value = Math.round(videoElement.volume * 100);
                            isMuted = videoElement.volume === 0;
                            updateMuteIcon();
                            showControlsTemporarily();
                        }
                        break;
                    case 'm':
                        e.preventDefault();
                        if (watchView.classList.contains('active')) {
                            btnMute.click();
                            showControlsTemporarily();
                        }
                        break;
                    case 'f':
                        e.preventDefault();
                        if (watchView.classList.contains('active')) {
                            toggleFullscreen();
                            showControlsTemporarily();
                        }
                        break;
                    case 'p':
                        e.preventDefault();
                        if (watchView.classList.contains('active')) {
                            btnPip.click();
                        }
                        break;
                    case 'escape':
                        if (document.fullscreenElement || document.webkitFullscreenElement) {
                            toggleFullscreen();
                        } else if (watchView.classList.contains('active')) {
                            showHomeView();
                        }
                        break;
                }
            });

            playerContainer.addEventListener('mousemove', () => {
                if (watchView.classList.contains('active')) {
                    showControlsTemporarily();
                }
            });
            playerContainer.addEventListener('touchstart', () => {
                if (watchView.classList.contains('active')) {
                    showControlsTemporarily();
                }
            }, { passive: true });

            window.addEventListener('scroll', () => {
                if (window.scrollY > 20) {
                    nav.classList.add('scrolled');
                } else {
                    nav.classList.remove('scrolled');
                }
            }, { passive: true });

            videoElement.volume = 0.8;
            volumeBar.value = 80;
            updateMuteIcon();
            renderVideoGrid();
            updateFullscreenIcon();

            // --- Mobile Landscape Orientation Enforcement ---
            (function() {
                const isMobile = /Android|iPhone|iPad|iPod|webOS/i.test(navigator.userAgent);
                if (!isMobile) return;

                let orientationOverlay = null;

                function createOrientationOverlay() {
                    if (orientationOverlay) return;
                    orientationOverlay = document.createElement('div');
                    orientationOverlay.id = 'orientation-overlay';
                    orientationOverlay.innerHTML = `
                <div style="
                    position: fixed;
                    inset: 0;
                    background: rgba(0,0,0,0.92);
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    z-index: 9999;
                    color: #fff;
                    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
                    text-align: center;
                    backdrop-filter: blur(20px);
                    -webkit-backdrop-filter: blur(20px);
                    pointer-events: all;
                ">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 24px; opacity: 0.8;">
                        <rect x="5" y="2" width="14" height="20" rx="2" ry="2" />
                        <line x1="12" y1="18" x2="12.01" y2="18" stroke-width="2" />
                    </svg>
                    <p style="font-size: 1.4rem; font-weight: 500; margin-bottom: 12px; letter-spacing: -0.02em;">Rotate your device</p>
                    <p style="color: rgba(255,255,255,0.6); font-size: 0.95rem; max-width: 280px; line-height: 1.5;">
                        Landscape mode provides the best viewing experience
                    </p>
                </div>`;
                    document.body.appendChild(orientationOverlay);
                }

                function removeOrientationOverlay() {
                    if (orientationOverlay) {
                        orientationOverlay.remove();
                        orientationOverlay = null;
                    }
                }

                function checkOrientation() {
                    if (!watchView.classList.contains('active')) {
                        removeOrientationOverlay();
                        return;
                    }

                    const isPortrait = window.innerWidth < window.innerHeight;
                    if (isPortrait) {
                        if (screen.orientation && screen.orientation.lock) {
                            screen.orientation.lock('landscape').catch(() => {
                                createOrientationOverlay();
                            });
                        } else {
                            createOrientationOverlay();
                        }
                    } else {
                        removeOrientationOverlay();
                    }
                }

                window.addEventListener('resize', checkOrientation);
                window.addEventListener('orientationchange', checkOrientation);

                const observer = new MutationObserver(() => {
                    if (watchView.classList.contains('active')) {
                        checkOrientation();
                    } else {
                        removeOrientationOverlay();
                    }
                });
                observer.observe(watchView, { attributes: true, attributeFilter: ['class'] });

                document.addEventListener('fullscreenchange', checkOrientation);
                document.addEventListener('webkitfullscreenchange', checkOrientation);
            })();

            console.log('WrangStream — Premium Streaming Platform');
        })();
    </script>
</body>
</html>
