<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>WrangStream — cinematic experience</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #000000;
            --surface: #0d0d0d;
            --surface-elevated: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-tertiary: rgba(255, 255, 255, 0.45);
            --accent-blue: #2997ff;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --radius-md: 14px;
            --radius-lg: 20px;
            --font-stack: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
            --transition-smooth: 0.35s cubic-bezier(0.25, 0.1, 0.25, 1);
            --nav-height: 56px;
            --max-width: 1400px;
        }

        body {
            background: var(--bg);
            font-family: var(--font-stack);
            color: var(--text-primary);
            overflow-x: hidden;
            height: 100vh;
            height: 100dvh;
            letter-spacing: -0.01em;
            user-select: none;
        }

        #app {
            min-height: 100%;
            position: relative;
            z-index: 2;
        }

        /* immersion cinematic backdrop */
        #immersion-backdrop {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.6s ease;
            background-size: cover;
            background-position: center;
            filter: blur(80px) saturate(1.5);
            transform: scale(1.1);
        }
        #immersion-backdrop.active {
            opacity: 1;
        }
        #immersion-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.75) 80%);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            z-index: 0;
        }
        #immersion-overlay.active { opacity: 1; }

        /* navigation */
        #nav {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            height: var(--nav-height);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            gap: 16px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 1.2rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .logo svg { width: 24px; height: 24px; }
        .search-wrap {
            position: relative;
            flex: 1;
            max-width: 340px;
        }
        .search-wrap input {
            width: 100%;
            height: 36px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05);
            color: white;
            padding: 0 16px 0 38px;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s;
        }
        .search-wrap input:focus { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); }
        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.5;
            width: 16px;
            height: 16px;
        }
        .nav-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-btn:hover { background: rgba(255,255,255,0.08); color: white; }

        /* views */
        .view { display: none; animation: fade 0.3s ease; }
        .view.active { display: block; }
        @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        #home-view {
            padding: 32px 28px 60px;
            max-width: var(--max-width);
            margin: 0 auto;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .section-title { font-size: 1.7rem; font-weight: 600; letter-spacing: -0.02em; }
        .section-subtitle { color: var(--text-tertiary); font-size: 0.85rem; }

        #video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 22px;
        }
        .video-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            overflow: hidden;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.04);
            transition: transform 0.25s ease, border-color 0.2s;
        }
        .video-card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,0.15); background: var(--surface-elevated); }
        .thumb-wrap {
            aspect-ratio: 16/9;
            overflow: hidden;
            position: relative;
            background: #0a0a0a;
        }
        .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
        .video-card:hover .thumb-wrap img { transform: scale(1.04); }
        .play-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0);
            transition: background 0.2s;
            pointer-events: none;
        }
        .video-card:hover .play-overlay { background: rgba(0,0,0,0.3); }
        .play-overlay svg { width: 42px; opacity: 0; transform: scale(0.8); transition: 0.2s; }
        .video-card:hover .play-overlay svg { opacity: 1; transform: scale(1); }
        .card-info { padding: 12px 14px 14px; }
        .card-title { font-weight: 500; font-size: 0.9rem; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-meta { font-size: 0.75rem; color: var(--text-tertiary); margin-top: 6px; display: flex; gap: 6px; align-items: center; }
        #no-results { text-align: center; padding: 60px; color: var(--text-tertiary); display: none; }
        #no-results.visible { display: block; }

        /* WATCH VIEW */
        #watch-view {
            display: none;
            flex-direction: column;
            min-height: 100vh;
        }
        #watch-view.active { display: flex; }
        .watch-nav {
            position: sticky;
            top: 0;
            backdrop-filter: blur(20px);
            background: rgba(0,0,0,0.5);
            height: var(--nav-height);
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 18px;
            z-index: 90;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .back-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: white;
            transition: 0.2s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.15); }
        .watch-content {
            display: flex;
            gap: 28px;
            padding: 28px;
            max-width: var(--max-width);
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }
        .player-col { flex: 1; min-width: 0; max-width: 900px; }
        .sidebar-col {
            width: 320px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .sidebar-heading { font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); padding-left: 6px; }
        .sidebar-video {
            display: flex;
            gap: 12px;
            cursor: pointer;
            padding: 8px;
            border-radius: 14px;
            transition: background 0.15s;
        }
        .sidebar-video:hover { background: rgba(255,255,255,0.05); }
        .s-thumb {
            width: 120px;
            height: 68px;
            border-radius: 10px;
            object-fit: cover;
            background: #111;
        }
        .s-title { font-size: 0.8rem; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
        .s-meta { font-size: 0.7rem; color: var(--text-tertiary); margin-top: 4px; }

        /* PLAYER */
        #player-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: black;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            cursor: pointer;
        }
        #player-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: black;
        }
        .buffering-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .buffering-indicator.visible { opacity: 1; }
        .spinner {
            width: 42px;
            height: 42px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .center-play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        #player-container.paused .center-play-btn { opacity: 1; }
        #player-container.idle .center-play-btn { opacity: 0; }
        .center-play-btn svg { width: 32px; margin-left: 4px; }

        #player-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.75) 40%, rgba(0,0,0,0.9));
            padding: 30px 16px 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        #player-container:hover #player-controls,
        #player-container.show-controls #player-controls { opacity: 1; pointer-events: auto; }
        .ctrl-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
        .seek-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .time-display { font-size: 0.7rem; font-variant-numeric: tabular-nums; color: rgba(255,255,255,0.8); min-width: 40px; text-align: center; }
        input[type="range"] { -webkit-appearance: none; background: transparent; flex: 1; height: 6px; border-radius: 3px; }
        input[type="range"]::-webkit-slider-runnable-track { background: rgba(255,255,255,0.2); height: 4px; border-radius: 2px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: white; border-radius: 50%; margin-top: -5px; cursor: pointer; opacity: 0; transition: opacity 0.1s; }
        #player-container:hover input[type="range"]::-webkit-slider-thumb { opacity: 1; }
        .ctrl-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.85);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .ctrl-btn:hover { background: rgba(255,255,255,0.12); color: white; }
        .volume-group { display: flex; align-items: center; gap: 0; }
        .volume-slider-wrap { width: 0; overflow: hidden; transition: width 0.2s; }
        .volume-group:hover .volume-slider-wrap { width: 70px; }
        .volume-slider-wrap input { width: 60px; margin-left: 4px; }
        .speed-btn {
            background: rgba(255,255,255,0.08);
            border: none;
            padding: 6px 12px;
            border-radius: 40px;
            color: white;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
        }
        #video-meta { padding: 20px 4px 12px; }
        .meta-title { font-size: 1.4rem; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 6px; }
        .meta-row { display: flex; gap: 16px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
        .action-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
            color: white;
            transition: 0.15s;
        }
        .action-btn.active { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.3); }
        .subscribe-btn { background: white; color: black; font-weight: 500; border: none; }
        .subscribe-btn.subscribed { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.2); }
        #comments-section { border-top: 1px solid rgba(255,255,255,0.06); margin-top: 10px; padding-top: 16px; }
        .comment { display: flex; gap: 12px; margin-bottom: 18px; }
        .comment-avatar { width: 34px; height: 34px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 500; flex-shrink: 0; }
        @media (max-width: 900px) {
            .watch-content { flex-direction: column; padding: 16px; }
            .sidebar-col { width: 100%; flex-direction: row; flex-wrap: wrap; gap: 12px; }
            .sidebar-video { flex: 1; min-width: 200px; }
            .s-thumb { width: 100%; height: auto; aspect-ratio: 16/9; }
            #video-grid { gap: 14px; }
        }
        @media (max-width: 600px) {
            #nav { padding: 0 12px; }
            .section-title { font-size: 1.3rem; }
            #video-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>

            { id:'v2', title:'It matters how you wake up', uploader:'Wagmen', streamUrl:'https://video.householdhandle.qzz.io/?q=aHR0cHM6Ly9odWdnaW5nZmFjZS5jby9kYXRhc2V0cy9qb2tlcnRoZXBva2VyL29sYXlvb28vcmVzb2x2ZS9tYWluL0l0JTIwbWF0dGVycyUyMGhvdyUyMHlvdSUyMHdha2UlMjB1cC5tcDQ=', thumbnailUrl:'https://image.householdhandle.qzz.io/?q=aHR0cHM6Ly9odWdnaW5nZmFjZS5jby9kYXRhc2V0cy9qb2tlcnRoZXBva2VyL29sYXlvb28vcmVzb2x2ZS9tYWluL0l0IG1hdHRlcnMgaG93IHlvdSB3YWtlIHVwLmpwZw==', comments:[{author:'LesbianHunter',text:'Deep vibes',time:'3h ago'}] },
            { id:'v3', title:'Spring Cumming', uploader:'Wagmen', streamUrl:'https://video.householdhandle.qzz.io/?q=aHR0cHM6Ly9odWdnaW5nZmFjZS5jby9kYXRhc2V0cy9qb2tlcnRoZXBva2VyL29sYXlvb28vcmVzb2x2ZS9tYWluL1NwcmluZyBDdW1taW5nLm1wNA==', thumbnailUrl:'https://image.householdhandle.qzz.io/?q=aHR0cHM6Ly9odWdnaW5nZmFjZS5jby9kYXRhc2V0cy9qb2tlcnRoZXBva2VyL29sYXlvb28vcmVzb2x2ZS9tYWluL1NwcmluZyBDdW1taW5nLmpwZw==', comments:[{author:'MILFLover',text:'incredible atmosphere',time:'11h ago'}] },
            { id:'v4', title:'Stepmom went a little overboard', uploader:'Wagmen', streamUrl:'https://video.householdhandle.qzz.io/?q=aHR0cHM6Ly9odWdnaW5nZmFjZS5jby9kYXRhc2V0cy9qb2tlcnRoZXBva2VyL29sYXlvb28vcmVzb2x2ZS9tYWluL1N0ZXBtb20gd2VudCBhIGxpdHRsZSBvdmVyYm9hcmQubXA0', thumbnailUrl:'https://image.householdhandle.qzz.io/?q=aHR0cHM6Ly9odWdnaW5nZmFjZS5jby9kYXRhc2V0cy9qb2tlcnRoZXBva2VyL29sYXlvb28vcmVzb2x2ZS9tYWluL1N0ZXBtb20gd2VudCBhIGxpdHRsZSBvdmVyYm9hcmQuanBn', comments:[{author:'SwallowMe',text:'Absolutely fire',time:'4h ago'}] }
        ];
        const videos = RAW_VIDEOS.map(v => ({ ...v, publishedDate: new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}) }));
        
        // state
        let currentVideoId = null;
        let isPlaying = false;
        let currentSpeed = 1;
        const speedOptions = [0.5,0.75,1,1.25,1.5,2];
        let speedIdx = 2;
        let volumeBeforeMute = 80;
        let isMuted = false;
        let controlsTimeout;
        
        // DOM
        const $ = s => document.querySelector(s);
        const homeView = $('#home-view');
        const watchView = $('#watch-view');
        const videoGrid = $('#video-grid');
        const searchInput = $('#search-input');
        const videoCountLabel = $('#video-count-label');
        const noResultsDiv = $('#no-results');
        const videoElement = $('#video-element');
        const playerContainer = $('#player-container');
        const buffering = $('#buffering-indicator');
        const seekBar = $('#seek-bar');
        const volumeBar = $('#volume-bar');
        const timeCurrent = $('#time-current');
        const timeDuration = $('#time-duration');
        const btnPlay = $('#btn-play');
        const iconPlay = $('#icon-play'), iconPause = $('#icon-pause');
        const btnMute = $('#btn-mute'), iconVolOn = $('#icon-vol-on'), iconVolOff = $('#icon-vol-off');
        const btnSpeed = $('#btn-speed');
        const btnFullscreen = $('#btn-fullscreen'), iconFsEnter = $('#icon-fs-enter'), iconFsExit = $('#icon-fs-exit');
        const btnPip = $('#btn-pip');
        const metaTitle = $('#meta-title'), metaChannel = $('#meta-channel'), metaDate = $('#meta-date');
        const likeCountSpan = $('#like-count'), dislikeCountSpan = $('#dislike-count');
        const btnLike = $('#btn-like'), btnDislike = $('#btn-dislike'), btnSubscribe = $('#btn-subscribe');
        const commentsList = $('#comments-list');
        const sidebarCol = $('#sidebar-col');
        const btnBack = $('#btn-back'), btnHomeNav = $('#btn-home-nav'), navLogo = $('#nav-logo');
        
        // helpers: storage
        function getLikeState(id){ return localStorage.getItem(`ws_${id}_like`)==='true'; }
        function setLikeState(id,val){ localStorage.setItem(`ws_${id}_like`,val); }
        function getDislikeState(id){ return localStorage.getItem(`ws_${id}_dislike`)==='true'; }
        function setDislikeState(id,val){ localStorage.setItem(`ws_${id}_dislike`,val); }
        function getSubscribeState(id){ return localStorage.getItem(`ws_${id}_sub`)==='true'; }
        function setSubscribeState(id,val){ localStorage.setItem(`ws_${id}_sub`,val); }
        function getLikeCount(id){ return parseInt(localStorage.getItem(`ws_${id}_likes`)||'0'); }
        function setLikeCount(id,val){ localStorage.setItem(`ws_${id}_likes`,Math.max(0,val)); }
        function getDislikeCount(id){ return parseInt(localStorage.getItem(`ws_${id}_dislikes`)||'0'); }
        function setDislikeCount(id,val){ localStorage.setItem(`ws_${id}_dislikes`,Math.max(0,val)); }
        
        function formatTime(sec){ if(isNaN(sec))return '0:00'; let s=Math.floor(sec); let m=Math.floor(s/60); let h=Math.floor(m/60); s%=60; m%=60; return h?`${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`:`${m}:${s.toString().padStart(2,'0')}`; }
        
        function setImmersionBG(url){ if(!url)return; const backdrop=$('#immersion-backdrop'); backdrop.style.backgroundImage=`url(${url})`; backdrop.classList.add('active'); $('#immersion-overlay').classList.add('active'); }
        function clearImmersion(){ $('#immersion-backdrop').classList.remove('active'); $('#immersion-overlay').classList.remove('active'); }
        
        function updatePlayIcon(){ isPlaying?(iconPlay.style.display='none',iconPause.style.display='block'):(iconPlay.style.display='block',iconPause.style.display='none'); }
        function updateLikeUI(){ if(!currentVideoId)return; let liked=getLikeState(currentVideoId); likeCountSpan.innerText=getLikeCount(currentVideoId); liked?btnLike.classList.add('active'):btnLike.classList.remove('active'); }
        function updateDislikeUI(){ if(!currentVideoId)return; let disliked=getDislikeState(currentVideoId); dislikeCountSpan.innerText=getDislikeCount(currentVideoId); disliked?btnDislike.classList.add('active'):btnDislike.classList.remove('active'); }
        function updateSubscribeUI(){ let subbed=getSubscribeState(currentVideoId); btnSubscribe.innerText=subbed?'Subscribed':'Subscribe'; subbed?btnSubscribe.classList.add('subscribed'):btnSubscribe.classList.remove('subscribed'); }
        
        function showHomeView(){
            watchView.classList.remove('active'); homeView.classList.add('active');
            clearImmersion(); videoElement.pause(); videoElement.src=''; videoElement.removeAttribute('src'); isPlaying=false; updatePlayIcon(); playerContainer.classList.add('paused'); playerContainer.classList.remove('idle');
            document.title='WrangStream'; renderVideoGrid(searchInput.value);
        }
        
        function renderComments(video){ commentsList.innerHTML=''; video.comments.forEach(c=>{ let div=document.createElement('div'); div.className='comment'; div.innerHTML=`<div class="comment-avatar">${c.author[0].toUpperCase()}</div><div class="comment-body"><div class="comment-author">${escapeHTML(c.author)}</div><div class="comment-text">${escapeHTML(c.text)}</div><div class="comment-time">${escapeHTML(c.time)}</div></div>`; commentsList.appendChild(div); }); }
        
        function renderSidebar(currentId){
            const heading=sidebarCol.querySelector('.sidebar-heading')|| (()=>{let h=document.createElement('span');h.className='sidebar-heading';h.innerText='Recommended';return h;})();
            sidebarCol.innerHTML=''; sidebarCol.appendChild(heading);
            videos.filter(v=>v.id!==currentId).forEach(v=>{
                let card=document.createElement('div'); card.className='sidebar-video';
                card.innerHTML=`<img class="s-thumb" src="${escapeHTML(v.thumbnailUrl)}" loading="lazy"><div class="s-info"><span class="s-title">${escapeHTML(v.title)}</span><span class="s-meta">${escapeHTML(v.uploader)}</span></div>`;
                card.addEventListener('click',()=>showWatchView(v.id));
                sidebarCol.appendChild(card);
            });
        }
        
        function showWatchView(videoId){
            const video=videos.find(v=>v.id===videoId); if(!video)return;
            currentVideoId=videoId;
            homeView.classList.remove('active'); watchView.classList.add('active');
            document.title=`${video.title} — WrangStream`; $('#watch-nav-title').innerText=video.title;
            setImmersionBG(video.thumbnailUrl);
            metaTitle.innerText=video.title; metaChannel.innerText=video.uploader; metaDate.innerText=video.publishedDate;
            updateLikeUI(); updateDislikeUI(); updateSubscribeUI(); renderComments(video); renderSidebar(videoId);
            playerContainer.classList.add('paused','show-controls'); playerContainer.classList.remove('idle');
            videoElement.src=video.streamUrl; videoElement.load(); videoElement.currentTime=0; isPlaying=false; updatePlayIcon();
            seekBar.value=0; timeCurrent.innerText='0:00'; timeDuration.innerText='0:00';
            videoElement.playbackRate=1; currentSpeed=1; speedIdx=2; btnSpeed.innerText='1×';
            if(controlsTimeout)clearTimeout(controlsTimeout);
            controlsTimeout=setTimeout(()=>{ if(isPlaying && !videoElement.paused){ playerContainer.classList.remove('show-controls'); playerContainer.classList.add('idle'); } },3000);
            window.scrollTo({top:0});
        }
        
        function togglePlay(){ 
            if(videoElement.paused || videoElement.ended){ videoElement.play().catch(e=>console.log); isPlaying=true; playerContainer.classList.remove('paused'); playerContainer.classList.add('show-controls'); playerContainer.classList.remove('idle'); } 
            else { videoElement.pause(); isPlaying=false; playerContainer.classList.add('paused'); playerContainer.classList.add('show-controls'); playerContainer.classList.remove('idle'); clearTimeout(controlsTimeout); }
            updatePlayIcon();
        }
        
        function showControlsTemp(){ playerContainer.classList.add('show-controls'); playerContainer.classList.remove('idle'); if(controlsTimeout)clearTimeout(controlsTimeout); if(isPlaying && !videoElement.paused){ controlsTimeout=setTimeout(()=>{ playerContainer.classList.remove('show-controls'); playerContainer.classList.add('idle'); },2500); } }
        
        // Fullscreen with landscape orientation lock (API)
        let fullscreenElement = playerContainer;
        async function toggleFullscreen(){
            try {
                if (!document.fullscreenElement) {
                    await fullscreenElement.requestFullscreen();
                    // after entering fullscreen, lock orientation to landscape
                    if (screen.orientation && screen.orientation.lock) {
                        await screen.orientation.lock('landscape').catch(e=>console.warn("orientation lock failed",e));
                    }
                } else {
                    await document.exitFullscreen();
                    if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
                }
            } catch(err){ console.warn(err); }
        }
        function updateFsIcon(){ let fsActive=!!(document.fullscreenElement); iconFsEnter.style.display=fsActive?'none':'block'; iconFsExit.style.display=fsActive?'block':'none'; }
        document.addEventListener('fullscreenchange',updateFsIcon);
        
        // video event listeners
        videoElement.addEventListener('loadedmetadata',()=>{ timeDuration.innerText=formatTime(videoElement.duration); seekBar.max=videoElement.duration; });
        videoElement.addEventListener('timeupdate',()=>{ if(videoElement.duration){ seekBar.value=videoElement.currentTime; seekBar.max=videoElement.duration; timeCurrent.innerText=formatTime(videoElement.currentTime); } });
        videoElement.addEventListener('play',()=>{ isPlaying=true; updatePlayIcon(); playerContainer.classList.remove('paused'); buffering.classList.remove('visible'); showControlsTemp(); });
        videoElement.addEventListener('pause',()=>{ isPlaying=false; updatePlayIcon(); playerContainer.classList.add('paused'); playerContainer.classList.add('show-controls'); clearTimeout(controlsTimeout); });
        videoElement.addEventListener('waiting',()=>buffering.classList.add('visible'));
        videoElement.addEventListener('canplay',()=>buffering.classList.remove('visible'));
        videoElement.addEventListener('ended',()=>{ isPlaying=false; updatePlayIcon(); playerContainer.classList.add('paused'); playerContainer.classList.add('show-controls'); });
        
        seekBar.addEventListener('input',()=>{ if(videoElement.duration) videoElement.currentTime=parseFloat(seekBar.value); showControlsTemp(); });
        volumeBar.addEventListener('input',()=>{ let val=volumeBar.value/100; videoElement.volume=val; isMuted=(val===0); updateMuteIcon(); if(val>0) volumeBeforeMute=volumeBar.value; });
        function updateMuteIcon(){ (isMuted || videoElement.volume===0)?(iconVolOn.style.display='none',iconVolOff.style.display='block'):(iconVolOn.style.display='block',iconVolOff.style.display='none'); }
        btnPlay.addEventListener('click',(e)=>{ e.stopPropagation(); togglePlay(); showControlsTemp(); });
        playerContainer.addEventListener('click',(e)=>{ if(e.target===playerContainer || e.target===videoElement || e.target.closest('#center-play-btn')){ if(!e.target.closest('#player-controls')) togglePlay(); } });
        btnMute.addEventListener('click',(e)=>{ e.stopPropagation(); if(isMuted || videoElement.volume===0){ videoElement.volume=volumeBeforeMute/100; volumeBar.value=volumeBeforeMute; isMuted=false; } else { volumeBeforeMute=Math.round(videoElement.volume*100); videoElement.volume=0; volumeBar.value=0; isMuted=true; } updateMuteIcon(); showControlsTemp(); });
        btnSpeed.addEventListener('click',()=>{ speedIdx=(speedIdx+1)%speedOptions.length; currentSpeed=speedOptions[speedIdx]; videoElement.playbackRate=currentSpeed; btnSpeed.innerText=currentSpeed+'×'; showControlsTemp(); });
        btnPip.addEventListener('click',async()=>{ try{ if(document.pictureInPictureElement) await document.exitPictureInPicture(); else await videoElement.requestPictureInPicture(); }catch(e){} });
        btnFullscreen.addEventListener('click',(e)=>{ e.stopPropagation(); toggleFullscreen(); showControlsTemp(); });
        
        btnLike.addEventListener('click',()=>{ if(!currentVideoId)return; let liked=getLikeState(currentVideoId), disliked=getDislikeState(currentVideoId); if(liked){ setLikeState(currentVideoId,false); setLikeCount(currentVideoId,getLikeCount(currentVideoId)-1); } else { setLikeState(currentVideoId,true); setLikeCount(currentVideoId,getLikeCount(currentVideoId)+1); if(disliked){ setDislikeState(currentVideoId,false); setDislikeCount(currentVideoId,getDislikeCount(currentVideoId)-1); } } updateLikeUI(); updateDislikeUI(); });
        btnDislike.addEventListener('click',()=>{ if(!currentVideoId)return; let disliked=getDislikeState(currentVideoId), liked=getLikeState(currentVideoId); if(disliked){ setDislikeState(currentVideoId,false); setDislikeCount(currentVideoId,getDislikeCount(currentVideoId)-1); } else { setDislikeState(currentVideoId,true); setDislikeCount(currentVideoId,getDislikeCount(currentVideoId)+1); if(liked){ setLikeState(currentVideoId,false); setLikeCount(currentVideoId,getLikeCount(currentVideoId)-1); } } updateDislikeUI(); updateLikeUI(); });
        btnSubscribe.addEventListener('click',()=>{ if(!currentVideoId)return; let sub=getSubscribeState(currentVideoId); setSubscribeState(currentVideoId,!sub); updateSubscribeUI(); });
        
        function renderVideoGrid(filter=''){
            let term=filter.toLowerCase().trim();
            let filtered=videos.filter(v=>v.title.toLowerCase().includes(term) || v.uploader.toLowerCase().includes(term));
            videoGrid.innerHTML='';
            if(filtered.length===0){ noResultsDiv.classList.add('visible'); videoCountLabel.innerText='0 videos'; }
            else { noResultsDiv.classList.remove('visible'); videoCountLabel.innerText=`${filtered.length} video${filtered.length!==1?'s':''}`; }
            filtered.forEach(v=>{ let card=document.createElement('div'); card.className='video-card'; card.innerHTML=`<div class="thumb-wrap"><img src="${escapeHTML(v.thumbnailUrl)}" loading="lazy"><div class="play-overlay"><svg viewBox="0 0 24 24" fill="white"><polygon points="6,3 20,12 6,21"/></svg></div></div><div class="card-info"><div class="card-title">${escapeHTML(v.title)}</div><div class="card-meta"><span>${escapeHTML(v.uploader)}</span><span class="dot">•</span><span>${escapeHTML(v.publishedDate)}</span></div></div>`; card.addEventListener('click',()=>showWatchView(v.id)); videoGrid.appendChild(card); });
        }
        
        function escapeHTML(str){ let div=document.createElement('div'); div.textContent=str; return div.innerHTML; }
        
        btnBack.addEventListener('click',showHomeView); btnHomeNav.addEventListener('click',showHomeView); navLogo.addEventListener('click',showHomeView);
        searchInput.addEventListener('input',()=>{ if(homeView.classList.contains('active')) renderVideoGrid(searchInput.value); });
        
        document.addEventListener('keydown',(e)=>{ if(e.target.tagName==='INPUT')return; if(!watchView.classList.contains('active'))return; let key=e.key.toLowerCase(); if(key===' '){ e.preventDefault(); togglePlay(); showControlsTemp(); } else if(key==='arrowleft'){ e.preventDefault(); videoElement.currentTime=Math.max(0,videoElement.currentTime-10); showControlsTemp(); } else if(key==='arrowright'){ e.preventDefault(); videoElement.currentTime=Math.min(videoElement.duration,videoElement.currentTime+10); showControlsTemp(); } else if(key==='arrowup'){ e.preventDefault(); videoElement.volume=Math.min(1,videoElement.volume+0.1); volumeBar.value=videoElement.volume*100; isMuted=videoElement.volume===0; updateMuteIcon(); showControlsTemp(); } else if(key==='arrowdown'){ e.preventDefault(); videoElement.volume=Math.max(0,videoElement.volume-0.1); volumeBar.value=videoElement.volume*100; isMuted=videoElement.volume===0; updateMuteIcon(); showControlsTemp(); } else if(key==='m'){ e.preventDefault(); btnMute.click(); } else if(key==='f'){ e.preventDefault(); toggleFullscreen(); } else if(key==='p'){ btnPip.click(); } else if(key==='escape' && document.fullscreenElement){ toggleFullscreen(); } });
        
        playerContainer.addEventListener('mousemove',()=>{ if(watchView.classList.contains('active')) showControlsTemp(); });
        videoElement.volume=0.8; volumeBar.value=80; updateMuteIcon(); updateFsIcon(); renderVideoGrid('');
    })();
</script>
</body>
</html>
